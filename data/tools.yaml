  # ─────────────────────────── mcp ───────────────────────────
  - id: palmier-pro
    guide: "guides/palmier-pro.md"
    name: "Palmier Pro"
    category: mcp
    kind: app
    agent: mcp
    pricing: paid
    key: none
    platforms: [macos]
    url: "https://palmierai.pro/"
    tagline: "Видеоредактор для macOS, у которого таймлайн выставлен наружу как MCP-сервер — агент правит монтаж сам."
    status: listed
    tags: [video-editing, timeline, macos]
    note: |
      Поднимает локальный MCP на `http://127.0.0.1:19789/mcp`. Подключаешь Claude Code / Claude Desktop /
      Cursor / Codex — и агент видит весь проект: какие клипы на каких дорожках, их длительность,
      исходные промпты. Дальше умеет читать таймлайн, добавлять и подрезать клипы, менять порядок,
      генерировать новый материал по промпту и перегенерировать уже сделанный.

      Ключевая разница с обычным редактором: контекст проекта живёт в том же чате, что и остальные
      MCP-серверы. То есть в одном разговоре можно найти сток через Pexels, сгенерировать озвучку
      и тут же положить это на таймлайн.

  - id: coverr-mcp
    name: "Coverr MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: required
    key_url: "https://coverr.co/"
    url: "https://coverr.co/"
    install: "claude mcp add --transport http coverr https://mcp.coverr.co/mcp"
    tagline: "B-roll в MP4 прямо из чата: `get_videos` → `get_video(id)` → готовый 1080p-линк."
    status: verified
    tags: [b-roll, video, stock]

  - id: pexels-mcp
    name: "Pexels MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: required
    key_url: "https://www.pexels.com/api/"
    env: [PEXELS_API_KEY]
    install: "uvx pexels-mcp-server"
    url: "https://www.pexels.com/api/"
    tagline: "Стоковые фото и видео. Рабочая лошадка для generic-кадров."
    status: verified
    tags: [stock, photo, video]
    note: |
      Для картинок бери размер `large2x` (до ~1880px), а не `original` — иначе упрёшься
      в потолок API при массовой выгрузке.

