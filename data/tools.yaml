categories:
  - id: agents
    name: "Агенты и оркестрация"
    emoji: "🤖"
    blurb: "Среда, из которой всё запускается. Агент читает задачу и сам дёргает нужные инструменты."

  - id: script
    name: "Сценарий и текст"
    emoji: "📝"
    blurb: "Первый шаг любого ролика. Ресёрч темы, структура, текст под озвучку, заголовки и описание."

  - id: mcp
    name: "MCP-серверы"
    emoji: "🔌"
    blurb: "Инструменты, подключаемые к агенту по протоколу MCP. Агент управляет ими напрямую — без копипасты и ручного клика."

  - id: video
    name: "Генерация видео"
    emoji: "🎬"
    blurb: "text→video и image→video. Основной расходник — деньги и время рендера, поэтому сначала смотри, нет ли готового стока."

  - id: image
    name: "Картинки: генерация и редактирование"
    emoji: "🖼️"
    blurb: "Генерация с нуля, img2img, инпейнт, удаление фона, апскейл."

  - id: runtime
    name: "Модели и где их запускать"
    emoji: "⚙️"
    blurb: "Веса, LoRA и площадки для инференса. Сюда идут, когда чужой сервис не устраивает по цене, приватности или контролю."

  - id: audio
    name: "Голос, музыка, звук"
    emoji: "🔊"
    blurb: "Озвучка, клонирование голоса, фоновая музыка, SFX, транскрипция."

  - id: motion
    name: "Моушн и анимация"
    emoji: "✨"
    blurb: "Движение в кадре: анимационные библиотеки, Lottie/Rive, процедурная графика."

  - id: assembly
    name: "Сборка, монтаж, рендер"
    emoji: "🧩"
    blurb: "Где всё склеивается в готовый файл."

  - id: repurpose
    name: "Переупаковка и субтитры"
    emoji: "✂️"
    blurb: "Длинное видео в короткие, автонарезка, субтитры, чистка речи. Самый дешёвый способ получить больше контента из уже снятого."

  - id: thumbnail
    name: "Превью, обложки, статика"
    emoji: "🎨"
    blurb: "Кадр, который решает, посмотрят ролик или нет. Плюс всё остальное, что не двигается."

  - id: assets
    name: "Стоки и готовые ассеты"
    emoji: "📦"
    blurb: "Фото, видео, GIF, шрифты, иконки, логотипы. Правило: сначала сток, потом генерация — быстрее и без лимитов."

  - id: data
    name: "Данные для контента"
    emoji: "📊"
    blurb: "Живые цифры для data-driven роликов: курсы, погода, новости, статистика."

  - id: research
    name: "Research и аналитика"
    emoji: "🔍"
    blurb: "Что снимать: ниши, конкуренты, ключевики, выбросы по просмотрам."

tools:

  # ─────────────────────────── agents ───────────────────────────
  - id: claude-code
    name: "Claude Code"
    category: agents
    kind: app
    agent: native
    pricing: paid
    key: none
    url: "https://claude.com/product/claude-code"
    docs: "https://docs.claude.com/en/docs/claude-code/overview"
    tagline: "Агент в терминале, десктопе, вебе и IDE. Точка входа во весь остальной стек."
    status: verified
    note: |
      Всё в этом каталоге так или иначе подключается сюда: MCP-серверы через `claude mcp add`,
      повторяемые процессы — через skills, многоагентные прогоны — через workflows.

  - id: mcp
    name: "Model Context Protocol"
    category: agents
    kind: spec
    agent: native
    pricing: oss
    key: none
    url: "https://modelcontextprotocol.io/"
    repo: "https://github.com/modelcontextprotocol"
    tagline: "Открытый протокол, по которому агент получает чужие инструменты. Причина, по которой этот каталог вообще имеет смысл."
    status: verified

  - id: claude-agent-sdk
    name: "Claude Agent SDK"
    category: agents
    kind: library
    agent: api
    pricing: paid
    key: required
    key_url: "https://console.anthropic.com/"
    url: "https://docs.claude.com/en/api/agent-sdk/overview"
    tagline: "Собрать своего агента с тем же циклом инструментов, что у Claude Code."
    status: listed

  # ─────────────────────────── mcp ───────────────────────────
  - id: palmier-pro
    guide: "guides/palmier-pro.md"
    name: "Palmier Pro"
    category: mcp
    kind: app
    agent: mcp
    pricing: paid
    key: none
    platforms: [macos]
    url: "https://palmierai.pro/"
    tagline: "Видеоредактор для macOS, у которого таймлайн выставлен наружу как MCP-сервер — агент правит монтаж сам."
    status: listed
    tags: [video-editing, timeline, macos]
    note: |
      Поднимает локальный MCP на `http://127.0.0.1:19789/mcp`. Подключаешь Claude Code / Claude Desktop /
      Cursor / Codex — и агент видит весь проект: какие клипы на каких дорожках, их длительность,
      исходные промпты. Дальше умеет читать таймлайн, добавлять и подрезать клипы, менять порядок,
      генерировать новый материал по промпту и перегенерировать уже сделанный.

      Ключевая разница с обычным редактором: контекст проекта живёт в том же чате, что и остальные
      MCP-серверы. То есть в одном разговоре можно найти сток через Pexels, сгенерировать озвучку
      и тут же положить это на таймлайн.

  - id: coverr-mcp
    name: "Coverr MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: required
    key_url: "https://coverr.co/"
    url: "https://coverr.co/"
    install: "claude mcp add --transport http coverr https://mcp.coverr.co/mcp"
    tagline: "B-roll в MP4 прямо из чата: `get_videos` → `get_video(id)` → готовый 1080p-линк."
    status: verified
    tags: [b-roll, video, stock]

  - id: pexels-mcp
    name: "Pexels MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: required
    key_url: "https://www.pexels.com/api/"
    env: [PEXELS_API_KEY]
    install: "uvx pexels-mcp-server"
    url: "https://www.pexels.com/api/"
    tagline: "Стоковые фото и видео. Рабочая лошадка для generic-кадров."
    status: verified
    tags: [stock, photo, video]
    note: |
      Для картинок бери размер `large2x` (до ~1880px), а не `original` — иначе упрёшься
      в потолок API при массовой выгрузке.

  - id: openverse-mcp
    name: "Openverse MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: none
    install: "npx -y mcp-openverse@latest"
    url: "https://openverse.org/"
    tagline: "CC-лицензированные картинки: Flickr, rawpixel, Wikimedia в одном поиске. Ключ не нужен."
    status: verified
    tags: [stock, creative-commons]
    note: "Сохраняй `creator` и `license` вместе с файлом — они понадобятся для атрибуции."

  - id: wikipedia-mcp
    name: "Wikipedia MCP"
    category: mcp
    kind: mcp
    agent: mcp
    pricing: free
    key: none
    install: "uvx wikipedia-mcp"
    url: "https://www.wikipedia.org/"
    tagline: "Лучший первый источник фото для известных сущностей — компаний, людей, продуктов."
    status: verified
    tags: [reference, photo]
    note: |
      Сток систематически промахивается по именованным сущностям: на запрос «Liquid Death»
      Pexels отдаст абстрактную банку. Wikipedia отдаёт настоящее lead-изображение статьи.

  - id: brandfetch-mcp
