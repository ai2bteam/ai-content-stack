# Таблица «задача → инструмент». Главная страница каталога строится вокруг неё:
# человек приходит с задачей, а не с названием тула.
# Значения в `tools` — это id из tools.yaml. Генератор сам развернёт их в ссылки
# и упадёт с ошибкой, если id не существует.

routing:
  - group: "Написать сценарий"
    rows:
      - task: "Собрать фактуру по теме"
        tools: [perplexity, exa, notebooklm, firecrawl-mcp]
        note: "NotebookLM отвечает только по загруженным источникам — сценарий не уплывает в выдумку."

      - task: "Найти, что реально болит у аудитории"
        tools: [gummysearch, answer-the-public, youtube-transcript-mcp]

      - task: "Проверить утверждение по исследованиям"
        tools: [consensus, elicit, semantic-scholar, openalex, google-scholar]
        note: "Нужно, если в ролике звучит «учёные доказали». OpenAlex — без ключа и лимитов."

      - task: "Размотать тему от одной статьи ко всем связанным"
        tools: [connected-papers, researchrabbit]

      - task: "Доказать, что компания это обещала и потом убрала"
        tools: [wayback]
        note: "Архив страницы — сильный аргумент в разоблачающем ролике."

      - task: "Не пересказать одну точку зрения как факт"
        tools: [ground-news, our-world-in-data]

      - task: "Найти свои цифры вместо чужой инфографики"
        tools: [dataset-search, kaggle, world-bank, fred]

      - task: "Копить фактуру между роликами"
        tools: [obsidian, readwise, raindrop, zotero, logseq]
        note: "Obsidian хранит всё в markdown на диске и умеет MCP — агент дотягивается до базы напрямую."

      - task: "Разложить структуру до написания"
        tools: [milanote, arc-studio, celtx]

      - task: "Написать и выстроить текст"
        tools: [claude-ai, trelby]

      - task: "Вычитать текст под озвучку"
        tools: [hemingway, languagetool, prowritingaid]
        note: "Текст для диктора проверяется чтением вслух — Hemingway ловит то, обо что споткнёшься."

      - task: "Почистить русский текст"
        tools: [glvrd, orfogrammka, turgenev]
        note: "Главред режет канцелярит и воду — в озвучке разница слышна сразу."

      - task: "Переформулировать абзац, который не звучит"
        tools: [quillbot]

      - task: "Убедиться, что текст не читается машинным"
        tools: [gptzero]

      - task: "Прочитать текст на камеру"
        tools: [qprompt]
        note: "Последнее звено между готовым сценарием и записью."

      - task: "Оценить заголовок"
        tools: [vidiq, coschedule-headline]

  - group: "Найти готовое"
    rows:
      - task: "Фото — реальное, живое, generic"
        tools: [pexels-mcp, openverse-mcp, unsplash-mcp]
        note: "Сначала Pexels. Openverse — если нужна CC-лицензия с атрибуцией."

      - task: "Фото известной компании, человека, продукта"
        tools: [wikipedia-mcp, wikimedia-commons, tavily-mcp]
        note: "Сток тут промахивается. Иди в Wikipedia за lead-изображением статьи."

      - task: "Видео B-roll в MP4"
        tools: [coverr-mcp, pexels-mcp]
        note: "На каждую сцену длиннее 3 секунд ищи видео, а не статичное фото."

      - task: "GIF"
        tools: [klipy-mcp]

      - task: "Логотип бренда"
        tools: [brandfetch-mcp]
        note: "Отдаёт SVG отдельно под светлый и тёмный фон."

      - task: "Космос, наука, съёмка Земли"
        tools: [nasa-mcp]

      - task: "Шрифты и иконки"
        tools: [google-fonts, lucide]

      - task: "3D-модель"
        tools: [sketchfab, polyhaven, mixamo]

      - task: "Текстуры, HDRI, анимации персонажей в CC0"
        tools: [polyhaven, ambientcg, mixamo]
        note: "CC0 — без атрибуции и ограничений, самый спокойный вариант для коммерции."

      - task: "Историческая и архивная фактура"
        tools: [internet-archive, loc, europeana, smithsonian, met-museum]
        note: "Большая часть в public domain — то, чего на стоках нет в принципе."

      - task: "Иллюстрации вместо фото"
        tools: [undraw, storyset, blush]
        note: "У всех настраивается акцентный цвет — подгоняются под палитру ролика."

      - task: "Бесплатный фотобанк без атрибуции"
        tools: [stocksnap, gratisography, picography, deathtostock, allthefreestock]
        note: "AllTheFreeStock — каталог остальных, начинать удобно с него."

      - task: "Лицо человека, которого не существует"
        tools: [generated-photos]
        note: "Снимает вопрос разрешения на съёмку: человека нет."

      - task: "Подобрать пару шрифтов"
        tools: [fontjoy, colors-and-fonts]

      - task: "Узнать, какой шрифт на чужом сайте"
        tools: [fontface-ninja]

  - group: "Сгенерировать, если готового нет"
    rows:
      - task: "Картинка по тексту"
        tools: [flux, cloudflare-workers-ai, nvidia-nim, pollinations]
        note: "Выстраивай в цепочку с фолбэком — бесплатные лимиты кончаются в самый неподходящий момент."

      - task: "Картинка по референсу, инпейнт, локальный контроль"
        tools: [comfyui, invokeai, rundiffusion]

      - task: "Понять, как просить нужный стиль"
        tools: [lexica, publicprompts, promptomania]
        note: "Lexica ищет по готовым картинкам вместе с их промптами — быстрее, чем угадывать словами."

      - task: "Stable Diffusion на Mac без командной строки"
        tools: [diffusionbee]

      - task: "Убрать фон / увеличить разрешение"
        tools: [rembg, upscayl, real-esrgan, magnific]
        note: "Локально — rembg и Upscayl. Magnific дорисовывает детали, но платный."

      - task: "Убрать со стока водяной знак или лишний объект"
        tools: [iopaint, clipdrop]

      - task: "Запустить открытую модель, не разворачивая железо"
        tools: [replicate, fal]
        note: "Оплата за секунды инференса. Дешевле, чем поднимать GPU ради одного ролика."

      - task: "Задать генерации точную позу или композицию"
        tools: [controlnet, ip-adapter]
        note: "Без них композиция — лотерея, сколько промпт ни переписывай."

      - task: "Держать одного персонажа похожим на себя между кадрами"
        tools: [ip-adapter, vidu, ltx-studio]
        note: "Главная нерешённая боль генеративного видео. Работает через раз — закладывай время."

      - task: "Взять веса или LoRA под нужный стиль"
        tools: [huggingface, civitai]

      - task: "Арендовать GPU под тяжёлую модель"
        tools: [runpod, modal]

      - task: "Языковая модель локально, без отправки материала наружу"
        tools: [ollama, lm-studio]

      - task: "Видео по тексту или по картинке"
        tools: [ltx-video, kling, runway, modelslab-video]
        note: "LTX-Video — если хочется без подписки. Kling — если нужна убедительная физика движения."

      - task: "Говорящий аватар"
        tools: [heygen]

      - task: "Озвучка — локально и бесплатно"
        tools: [voicebox, kokoro, chatterbox]

      - task: "Озвучка — максимальное качество"
        tools: [elevenlabs]

      - task: "Фоновая музыка"
        tools: [suno, ace-step]

      - task: "Звуковые эффекты"
        tools: [freesound]

      - task: "Субтитры и тайминги"
        tools: [whisper]

  - group: "Собрать ролик"
    rows:
      - task: "Программная сборка видео"
        tools: [remotion]
        note: "Кадр — функция от номера кадра. Диффы читаемые, рендер воспроизводимый."

      - task: "Монтаж из чата, руками агента"
        tools: [palmier-pro]
        note: "Единственный в списке редактор, который отдаёт таймлайн наружу по MCP."

      - task: "Нарезка, конвертация, сведение звука"
        tools: [ffmpeg, moviepy]

      - task: "Записать HTML/Canvas-сцену в видео"
        tools: [playwright]

      - task: "Записать экран"
        tools: [obs, screen-studio, loom]
        note: "OBS бесплатен и умеет всё. Screen Studio даёт тот самый плавный зум за деньги."

      - task: "Процедурный фон, которого нет ни у кого"
        tools: [shadertoy, hydra, touchdesigner, canvas-sketch, p5js]

      - task: "Анимация в вебе — лендинг, интерфейс, HTML-сцена"
        tools: [motion, gsap]
        note: "Для Remotion не подходит: там время идёт по кадрам, а не по часам."

      - task: "Готовая векторная анимация"
        tools: [lottie, rive]

      - task: "3D в кадре"
        tools: [three-js, react-three-fiber, drei, blender]

      - task: "Рендер видео в облаке по API"
        tools: [shotstack, creatomate]
        note: "Когда роликов сотня и они различаются только текстом и картинкой."

      - task: "Объясняющий ролик со схемами и формулами"
        tools: [manim, motion-canvas]

  - group: "Переупаковать снятое"
    rows:
      - task: "Нарезать длинное видео на вертикальные клипы"
        tools: [opusclip, klap, vizard]
        note: "У Klap есть API — только он встраивается в конвейер без ручного захода на сайт."

      - task: "Убрать паузы и слова-паразиты"
        tools: [auto-editor, descript]
        note: "auto-editor делает это бесплатно и одной командой."

      - task: "Субтитры с пословным таймингом"
        tools: [whisperx, faster-whisper, subtitle-edit]
        note: "Локально и бесплатно. Из пословных таймингов собираются «прыгающие» субтитры."

      - task: "Транскрипция по API, без возни с локальным железом"
        tools: [assemblyai, deepgram, happyscribe]

      - task: "Понять, кто из говорящих сказал реплику"
        tools: [pyannote]

      - task: "Вычистить звук: эхо, шум, разная громкость"
        tools: [adobe-podcast, auphonic, demucs]

  - group: "Сделать превью"
    rows:
      - task: "Собрать обложку руками"
        tools: [canva, figma, photopea]

      - task: "Нужен читаемый текст внутри картинки"
        tools: [ideogram, recraft]
        note: "Остальные генераторы на тексте до сих пор ломаются."

      - task: "Пачка однотипных обложек из данных"
        tools: [satori, imagemagick, photoroom]
        note: "Satori рисует превью из JSX — значит, оно генерится из тех же данных, что и ролик."

      - task: "Подобрать палитру"
        tools: [coolors, colorhunt, adobe-color, colorspace]

      - task: "Проверить, читается ли надпись"
        tools: [colorable, realtime-colors, color-oracle]
        note: "Color Oracle показывает кадр глазами дальтоника — это восемь процентов мужской аудитории."

      - task: "Фирменные цвета чужого бренда"
        tools: [brandcolors, brandfetch-mcp, simple-icons]

      - task: "Схема или диаграмма в кадр"
        tools: [mermaid, d2, excalidraw, mcp-mermaid]
        note: "Все описываются текстом — значит, правятся в диффе, а не перетаскиванием прямоугольников."

  - group: "Понять, что снимать"
    rows:
      - task: "Найти чужой ролик, выстреливший выше нормы канала"
        tools: [oneof10, vidiq, nexlev, viewstats]
        note: "Ищем сработавший формат, а не просто популярный канал."

      - task: "Найти молодые каналы в нише, пока их не видно"
        tools: [channel-crawler, nexlev]

      - task: "Понять, есть ли шанс пробиться по запросу"
        tools: [morningfame, ahrefs, semrush]
        note: "Отговаривает от тем, где против тебя играют каналы на порядок крупнее."

      - task: "Ниши, конкуренты, ключевые слова"
        tools: [vidiq, tubebuddy, keywords-everywhere, keyword-planner]

      - task: "Статистика видео и каналов из первоисточника"
        tools: [youtube-data-api, playboard]

      - task: "Понять, где водится моя аудитория"
        tools: [sparktoro, gummysearch]

      - task: "Проверить блогера перед интеграцией"
        tools: [hypeauditor, noxinfluencer]
        note: "Накрутка вскрывается до оплаты, а не после."

      - task: "Разобрать чужой сайт или компанию для ролика"
        tools: [similarweb, spyfu, buzzsumo, wayback]

      - task: "Живые данные в кадр — курсы, погода, новости"
        tools: [public-apis, coingecko, open-meteo]

      - task: "Графики из этих данных"
        tools: [recharts, chartjs, visx, echarts]
        note: "Recharts — дефолт для React. ECharts — если нужны карты или десятки тысяч точек."

      - task: "Что в тренде прямо сейчас"
        tools: [google-trends-trending, tiktok-creative-center, glimpse]
        note: "Creative Center отдаёт официальные данные TikTok бесплатно и без рекламного кабинета."

      - task: "Поймать тему до пика, а не на пике"
        tools: [pinterest-trends, exploding-topics]
        note: "В Pinterest сезонные темы всплывают за месяцы до всплеска в поиске."

      - task: "Проверить, не поздно ли снимать тему"
        tools: [google-trends, glimpse]

      - task: "Вопросы, которые люди реально задают"
        tools: [answer-the-public, alsoasked]
        note: "AlsoAsked строит дерево вопросов — готовая структура разделов сценария."
